name: Generate UI Icon Assets

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/icons/**'
      - 'package.json'
      - '.github/workflows/icon-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-icon-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate SVG source and PNG runtime icons
        run: npm run icons:build
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AssetsSource/UI/Icons public/assets/ui/icons src/ui/icons/icon-manifest.generated.ts src/ui/icons/runtime-icons.generated.tsx
          if git diff --cached --quiet; then
            echo "Icon assets are already up to date."
            exit 0
          fi
          git commit -m "chore(ui): generate PNG icon runtime assets"
          git push
