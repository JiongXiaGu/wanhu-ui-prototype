name: UI Review

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/capture-*-review.mjs'
      - 'scripts/ui-review-modules.mjs'
      - 'scripts/check-pr-scope.mjs'
      - 'public/assets/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.*'
      - '.github/workflows/ui-review.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/capture-*-review.mjs'
      - 'scripts/ui-review-modules.mjs'
      - 'scripts/check-pr-scope.mjs'
      - 'public/assets/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.*'
      - '.github/workflows/ui-review.yml'
  workflow_dispatch:

concurrency:
  group: ui-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.classify.outputs.module }}
      reviews: ${{ steps.classify.outputs.reviews }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify review scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
            node scripts/check-pr-scope.mjs --input /tmp/changed-files.txt
          else
            echo "module=full" >> "$GITHUB_OUTPUT"
            echo "reviews=core,hud,dialog,readability,tools,selection" >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: scope
    if: ${{ contains(needs.scope.outputs.reviews, 'core') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start Vite review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wanhu-vite.log
          exit 1
      - name: Capture core UI review
        run: node scripts/capture-ui-review.mjs
      - name: Upload core UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review-core
          path: review-screenshots/
          if-no-files-found: error
          retention-days: 7
          compression-level: 7

  hud:
    needs: scope
    if: ${{ contains(needs.scope.outputs.reviews, 'hud') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start Vite review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wanhu-vite.log
          exit 1
      - name: Capture HUD foreground contract
        run: node scripts/capture-hud-foreground-review.mjs
      - name: Upload HUD review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-foreground-review
          path: |
            review-screenshots/hud-foreground-*.png
            review-screenshots/hud-foreground-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  dialog:
    needs: scope
    if: ${{ contains(needs.scope.outputs.reviews, 'dialog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start Vite review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wanhu-vite.log
          exit 1
      - name: Capture shared dialog system
        run: node scripts/capture-input-dialog-system-review.mjs
      - name: Upload dialog review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialog-review
          path: review-screenshots/dialog-*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  readability:
    needs: scope
    if: ${{ contains(needs.scope.outputs.reviews, 'readability') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start Vite review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wanhu-vite.log
          exit 1
      - name: Capture readability and decision surfaces
        run: node scripts/capture-typography-decision-review.mjs
      - name: Upload visual governance review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-governance-review
          path: |
            review-screenshots/readability-*.png
            review-screenshots/color-scheme-focus.png
            review-screenshots/loading-space.png
            review-screenshots/readability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  tools:
    needs: scope
    if: ${{ contains(needs.scope.outputs.reviews, 'tools') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start Vite review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wanhu-vite.log
          exit 1
      - name: Capture tool usability and layout
        run: node scripts/capture-tool-usability-review.mjs
      - name: Upload tool review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-review
          path: |
            review-screenshots/*.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 8

  selection:
    needs: scope
    if: ${{ contains(needs.scope.outputs.reviews, 'selection') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start Vite review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wanhu-vite.log
          exit 1
      - name: Capture building selection flow
        run: node scripts/capture-building-selection-review.mjs
      - name: Upload building selection review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-selection-review
          path: |
            review-screenshots/building-selection-*.png
            review-screenshots/building-selection-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 8

  gate:
    if: always()
    needs: [scope, core, hud, dialog, readability, tools, selection]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected review groups to pass
        env:
          SCOPE: ${{ needs.scope.result }}
          CORE: ${{ needs.core.result }}
          HUD: ${{ needs.hud.result }}
          DIALOG: ${{ needs.dialog.result }}
          READABILITY: ${{ needs.readability.result }}
          TOOLS: ${{ needs.tools.result }}
          SELECTION: ${{ needs.selection.result }}
        run: |
          for result in "$SCOPE" "$CORE" "$HUD" "$DIALOG" "$READABILITY" "$TOOLS" "$SELECTION"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "UI Review group failed: $result"
              exit 1
            fi
          done
