name: UI Review

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'scripts/capture-ui-review.mjs'
      - 'scripts/capture-input-dialog-system-review.mjs'
      - 'scripts/capture-typography-decision-review.mjs'
      - 'scripts/capture-tool-usability-review.mjs'
      - 'scripts/capture-building-selection-review.mjs'
      - 'public/assets/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.*'
      - '.github/workflows/ui-review.yml'
  workflow_dispatch:

concurrency:
  group: ui-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Cache Playwright browser
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.55.0-chromium
      - name: Install Playwright package
        run: npm install --no-save --prefer-offline --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Start Vite review server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/wanhu-vite.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wanhu-vite.log
          exit 1
      - name: Capture and assert UI review
        run: node scripts/capture-ui-review.mjs
      - name: Capture shared dialog system
        run: node scripts/capture-input-dialog-system-review.mjs
      - name: Capture typography decision surfaces
        run: node scripts/capture-typography-decision-review.mjs
      - name: Upload visual governance review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-governance-review
          path: |
            review-screenshots/readability-main-menu.png
            review-screenshots/readability-new-game.png
            review-screenshots/readability-new-game-focus.png
            review-screenshots/readability-settings.png
            review-screenshots/readability-save.png
            review-screenshots/readability-save-focus.png
            review-screenshots/loading-space.png
            review-screenshots/readability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Capture tool usability and layout
        run: node scripts/capture-tool-usability-review.mjs
      - name: Capture building selection flow
        run: node scripts/capture-building-selection-review.mjs
      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: review-screenshots/
          if-no-files-found: error
          retention-days: 7
      - name: Upload dialog review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialog-review
          path: review-screenshots/dialog-*.png
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload hover surface review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hover-surface-review
          path: |
            review-screenshots/hover-*.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload main dock review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-dock-review
          path: |
            review-screenshots/main-dock-*.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload top shell review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-shell-review
          path: |
            review-screenshots/top-control-tray.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload blueprint workspace review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-workspace-review
          path: |
            review-screenshots/blueprint-workspace-*.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload blueprint authoring review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-authoring-review
          path: |
            review-screenshots/blueprint-workflow-*.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload workspace pager review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-pager-review
          path: |
            review-screenshots/workspace-pager-*.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload secondary action review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secondary-action-review
          path: |
            review-screenshots/secondary-action-*.png
            review-screenshots/tool-usability-report.json
            review-screenshots/building-selection-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload operation hints review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operation-hints-review
          path: |
            review-screenshots/operation-hints-*.png
            review-screenshots/tool-usability-report.json
            review-screenshots/building-selection-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload placement review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placement-review
          path: |
            review-screenshots/placement-building-84.png
            review-screenshots/placement-building-utility-two-rows.png
            review-screenshots/placement-road-84.png
            review-screenshots/placement-tree-84.png
            review-screenshots/placement-city-wall-84.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
      - name: Upload building selection review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: building-selection-review
          path: |
            review-screenshots/building-selection-*.png
            review-screenshots/building-selection-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload world utility review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-utility-review
          path: |
            review-screenshots/usability-world-utility-two-rows.png
            review-screenshots/usability-world-utility-demolition-active.png
            review-screenshots/usability-world-utility-workspace-balanced.png
            review-screenshots/tool-usability-report.json
          if-no-files-found: warn
          retention-days: 7
