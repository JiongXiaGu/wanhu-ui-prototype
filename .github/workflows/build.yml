name: Build

on:
  push:
    branches:
      - main
      - 'tmp-*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run icons:check
      - run: npm run audit:scale
      - run: npm run audit:unity
      - run: node scripts/test-tool-usability.mjs
      - run: node scripts/test-building-selection.mjs
      - run: npm run build
