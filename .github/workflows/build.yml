name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PR module scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          node scripts/check-pr-scope.mjs --input /tmp/changed-files.txt
      - run: npm install
      - name: Freeze direct dependency versions
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const root = lock.packages?.[''];
          if (!root) throw new Error('package-lock root package entry is missing');

          for (const section of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[section] ?? {})) {
              const resolved = lock.packages?.[`node_modules/${name}`]?.version;
              if (!resolved) throw new Error(`Unable to resolve direct dependency: ${name}`);
              pkg[section][name] = resolved;
              root[section][name] = resolved;
            }
          }

          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit frozen dependency graph
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- package.json package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: freeze npm dependency graph"
          git push origin "HEAD:$HEAD_REF"
      - name: Export resolved package lock
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: w0-2-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run icons:check
      - run: npm run audit:scale
      - name: Test visual governance guard
        run: node --test scripts/audit-visual-governance.test.mjs
      - name: Audit visual governance
        run: npm run audit:visual
      - name: Audit Unity 6000.6 migration compatibility
        run: npm run audit:unity
      - run: node scripts/test-tool-usability.mjs
      - run: node scripts/test-building-selection.mjs
      - run: node scripts/test-world-utility.mjs
      - run: npm run build
