name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PR module scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
          node scripts/check-pr-scope.mjs --input /tmp/changed-files.txt
      - run: npm ci
      - run: npm run icons:check
      - run: npm run audit:scale
      - name: Test visual governance guard
        run: node --test scripts/audit-visual-governance.test.mjs
      - name: Audit visual governance
        run: npm run audit:visual
      - name: Audit Unity 6000.6 migration compatibility
        run: npm run audit:unity
      - run: node scripts/test-tool-usability.mjs
      - run: node scripts/test-building-selection.mjs
      - run: node scripts/test-world-utility.mjs
      - run: npm run build
