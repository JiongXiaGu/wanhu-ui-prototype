name: Migrate PNG Icon CSS

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/migrate-png-icon-css.mjs'
      - '.github/workflows/migrate-png-icon-css.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-png-icon-css-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Migrate dead SVG selectors to PNG UiIcon
        run: node scripts/migrate-png-icon-css.mjs
      - name: Commit migrated CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "PNG icon CSS already migrated."
            exit 0
          fi
          git commit -m "refactor(ui): migrate SVG selectors to PNG icons"
          git push
